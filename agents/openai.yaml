interface:
  display_name: "Aperospec"
  short_description: "高位重构现实并列出焦点，由用户选定后进入利益博弈"
  default_prompt: "使用 $aperospec 先完成第一阶段：把当前定义降为可被现实修正的临时模型，保留异常与矛盾，重构当下如何形成，区分各方立场、公开理由、实际利益与运行作用力，形成基准未来判断，并列出有因果依据的焦点集合。不要替我选择或排序焦点。当我选定焦点后，进入第二阶段：帮助我确认焦点背后的利益驱动、期望方向、资源与损失边界，再调用适合的博弈与决策方法评估战略可达性、反应链、策略、行动与反馈。"

policy:
  allow_implicit_invocation: true
